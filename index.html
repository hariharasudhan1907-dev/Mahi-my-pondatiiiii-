<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Two Hearts, One Story 🖤💜</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="heart-screen" id="heartScreen">

    <h1>Two Hearts, One Story</h1>

    <p>Two different hearts, one beautiful story...</p>

    <div class="hearts" id="hearts">

        <div class="heart black">🖤</div>

        <div class="heart purple">💜</div>

    </div>

    <button id="mergeBtn">
        Shall We Become One? 🥺
    </button>

</section>


<section class="letter-screen" id="letterScreen">
    <div class="letter" id="letter">
        <div class="wax-seal">💜</div>
        <h2>Oiii... Myiluuuuu maa</h2>
        <div class="divider">✦ ❦ ✦</div>
        <p id="message"></p>
        <div class="signature">Forever Yours 🖤</div>
    </div>
<audio id="bgMusic" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" class="music-btn">🎵 Music On</button>
</section>
<script src="script.js"></script>

</body>
</html>
